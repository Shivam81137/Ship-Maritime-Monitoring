version: '3.8'

services:
  api:
    build: .
    container_name: ship_monitoring_api
    command: uvicorn main_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: .
    container_name: ship_monitoring_frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:8000/analyze
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    restart: unless-stopped
